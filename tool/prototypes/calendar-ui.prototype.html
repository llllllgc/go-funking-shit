@font-face{font-family:Zpix;src:url('../../assets/fonts/zpix.ttf') format('truetype');font-display:swap}

h1,h2,p{margin:0}h1,h2,.pixel{font-family:var(--font-display);font-weight:400;font-style:normal;min-width:0;overflow-wrap:anywhere}h1{font-size:28px;line-height:1.4}h2{font-size:20px;line-height:1.5}.muted{color:var(--color-muted)}.tiny{font-size:11px}.prototype-note{max-width:420px;margin:0 auto;padding:12px 20px;color:var(--color-muted);font-size:11px;border-bottom:1px dashed var(--color-rule)}
#app{max-width:420px;margin:auto;padding:12px 20px 28px;min-height:650px}.toolbar{display:flex;align-items:center;gap:8px;min-height:56px;margin-bottom:20px}.toolbar h1{flex:1}.icon-btn{padding:8px;min-width:44px;font-size:24px;line-height:1}.text-btn{font-size:13px;color:var(--color-moss-ink)}.toolbar .text-btn{padding-inline:8px}.toolbar .back{margin-left:-8px}.month-bar{display:flex;justify-content:space-between;align-items:center;margin:12px 0}.month-name{font-family:var(--font-display);font-size:23px}.calendar{margin-inline:-14px}.weekdays,.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));text-align:center}.weekdays{font-size:12px;color:var(--color-muted);padding-bottom:8px}.day{padding:0;min-height:48px;height:48px;display:flex;align-items:center;justify-content:center}.daybox{display:flex;flex-direction:column;justify-content:center;align-items:center;width:34px;height:42px;border:1px solid var(--color-clear)}.day.selected .daybox{border:1px solid var(--color-moss);background:var(--color-pale)}.day b{font-weight:400;line-height:22px;font-size:16px;position:relative}.day.today b:after{content:'';height:2px;width:12px;background:var(--color-moss);position:absolute;bottom:0;left:50%;transform:translateX(-50%)}.marker{height:14px;line-height:14px;font-size:10px;color:var(--color-moss-ink)}.dot{display:inline-block;width:4px;height:4px;background:var(--color-moss);vertical-align:middle}.day:disabled{color:var(--color-rule)}.legend{display:flex;gap:16px;margin:16px 0 24px;font-size:11px;color:var(--color-muted);align-items:center}.today-line{display:inline-block;width:12px;height:2px;background:var(--color-moss);vertical-align:middle;margin-right:4px}.details{border-top:1px solid var(--color-rule);padding-top:16px}.detail-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}.detail-head h2{font-size:18px}.detail-head button{padding-inline:4px}.row{display:flex;gap:12px;align-items:center;min-height:76px;border-bottom:1px solid var(--color-rule)}.row time{font-size:14px}.row img{width:36px;height:36px;object-fit:contain}.record-copy{flex:1}.record-copy b{display:block;font-family:var(--font-display);color:var(--color-moss-ink);font-weight:400;font-size:16px}.record-copy span{font-size:12px}.row button{font-size:12px;color:var(--color-muted);padding-inline:4px}.empty{padding:28px 0 20px;text-align:center}.empty svg{width:32px;height:44px;display:block;margin:0 auto 16px}.empty p{font-size:14px;margin-bottom:4px}.empty small{font-size:12px;color:var(--color-muted)}.outline-btn{border:1px solid var(--color-moss);color:var(--color-moss-ink);margin-top:16px}.summary{font-size:13px;color:var(--color-muted);margin:4px 0 20px}.ticket-hero{border-top:1px solid var(--color-ink);border-bottom:1px dashed var(--color-rule);display:flex;align-items:center;gap:16px;padding:16px 0;margin-bottom:12px}.ticket-number{font-family:var(--font-display);font-size:64px;line-height:1;color:var(--color-moss-ink)}.ticket-copy{flex:1;font-size:13px;line-height:1.8}.ticket-hero button{border-bottom:1px solid var(--color-moss);color:var(--color-moss-ink);padding-inline:0}.variant-B .day{height:44px;min-height:44px}.variant-B .daybox{height:40px}.variant-B .details{border-top:1px dashed var(--color-rule)}.view-tabs{display:flex;gap:24px;border-bottom:1px solid var(--color-rule);margin:0 0 20px}.view-tabs button{padding:8px 0}.view-tabs .current{border-bottom:2px solid var(--color-moss);color:var(--color-moss-ink)}.nav{display:flex;justify-content:space-around;align-items:center;margin:40px -20px 0;padding:16px 0;border-top:1px solid var(--color-rule)}.nav button{min-width:64px;font-size:13px}.nav .record-action{border:2px solid var(--color-ink);background:var(--color-mustard);border-radius:50%;width:64px;height:64px;padding:0;font-family:var(--font-display);font-size:16px}.nav .active{color:var(--color-moss-ink)}.nav img{width:24px;height:24px;display:block;margin:auto}.home-title{font-size:40px}.home-status{margin:40px 8px 28px}.home-status h2{font-size:28px}.home-count{display:flex;align-items:center;gap:12px}.home-count strong{font-family:var(--font-display);font-size:88px;font-weight:400;color:var(--color-moss)}.home-count span{font-family:var(--font-display);font-size:28px}.home-count img{width:132px;height:132px;object-fit:contain;margin-left:auto;image-rendering:pixelated}.latest{font-size:14px;margin-bottom:32px}.week-heading{display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--color-rule);padding-top:16px}.week-heading .tools{display:flex;align-items:center;font-size:13px;gap:4px}.mini-week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));margin-top:16px}.mini-week button{padding:4px 0;min-height:100px;display:flex;flex-direction:column;align-items:center;gap:8px}.mini-week svg{width:28px;height:44px}.mini-week small{font-size:11px}.home-hint{text-align:center;font-size:14px;color:var(--color-muted);margin-top:24px}.calendar-icon{width:20px;height:20px}.history-group{margin:24px 0}.history-group h2{font-size:18px}.form-date{border-top:1px solid var(--color-rule);border-bottom:1px solid var(--color-rule);padding:16px 0;margin:12px 0 24px}.pills{display:flex;gap:8px;margin-bottom:12px}.pills button{border:1px solid var(--color-rule);font-size:13px;min-width:64px}.pills .chosen{border-color:var(--color-moss);background:var(--color-pale);color:var(--color-moss-ink)}.fields{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:12px}.fields label{font-size:12px;color:var(--color-muted)}input,select{min-height:44px;border:1px solid var(--color-rule);background:var(--color-raised);padding:8px;max-width:100%;width:100%;border-radius:0;margin-top:4px}.shape-list{margin-top:16px}.shape-choice{display:flex;width:100%;text-align:left;gap:16px;align-items:center;min-height:68px;border-bottom:1px solid var(--color-rule);padding:8px 4px}.shape-choice img{width:40px;height:40px}.shape-choice .shape-copy{flex:1;font-size:14px}.shape-choice .shape-code{font-family:var(--font-display);color:var(--color-moss-ink);font-size:16px;margin-right:12px}.shape-choice .radio{width:14px;height:14px;border:1px solid var(--color-rule);flex-shrink:0}.shape-choice[aria-pressed=true]{background:var(--color-pale)}.shape-choice[aria-pressed=true] .radio{background:var(--color-moss);border-color:var(--color-moss)}.save{display:block;width:100%;background:var(--color-moss);color:var(--color-raised);margin-top:24px;min-height:48px}.save:disabled{background:var(--color-disabled);color:var(--color-muted)}.error{font-size:12px;color:var(--color-danger);min-height:18px;margin:8px 0}.success{font-size:12px;color:var(--color-moss-ink);margin-bottom:12px}.switcher{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);max-width:calc(100% - 16px);width:380px;background:var(--color-ink);color:var(--color-raised);padding:4px 8px;z-index:5}.switch-top{display:flex;align-items:center;justify-content:space-between;font-size:13px}.switch-top button{color:var(--color-raised);min-width:44px}.switch-top button:hover{background:var(--color-moss)}.switch-meta{font-size:10px;text-align:center;padding:0 0 6px;color:var(--color-disabled)}.demo-links{display:flex;gap:12px;align-items:center;justify-content:space-between;max-width:420px;margin:auto;padding:0 12px;border-bottom:1px dashed var(--color-rule);font-size:12px}.demo-links button{font-size:12px;padding:4px 8px}.demo-links span{font-size:10px;color:var(--color-muted)}dialog{border:1px solid var(--color-rule);background:var(--color-paper);padding:24px;width:min(340px,calc(100% - 32px));color:var(--color-ink)}dialog::backdrop{background:var(--color-overlay)}.dialog-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}.dialog-head h2{font-size:20px}.dialog-fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}.dialog-fields label{font-size:12px}.dialog-actions{display:flex;gap:12px;margin-top:24px}.dialog-actions button{flex:1;border:1px solid var(--color-rule)}.dialog-actions .confirm{background:var(--color-moss);color:var(--color-raised)}
@media(max-width:350px){.toolbar{gap:4px}.toolbar h1{font-size:25px}.toolbar .text-btn{font-size:12px}.month-name{font-size:21px}.ticket-number{font-size:52px}.record-copy span{font-size:11px}.row{gap:8px}.fields{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)}}
@media(prefers-reduced-motion:reduce){button:active{transform:none}}

<body>
<div class="prototype-note">交互草图 · 演示数据，不会写入 App · 今天固定为 2026.09.19</div>
<nav class="demo-links" aria-label="演示入口"><button data-action="home">首页入口</button><button data-action="history">历史入口</button><button data-action="calendar-demo">直接看月历</button><span>可点击体验</span></nav>
<main id="app"></main>
<div class="switcher" aria-label="设计方案切换"><div class="switch-top"><button data-action="variant-prev" aria-label="上一个设计方案">←</button><span id="variant-label"></span><button data-action="variant-next" aria-label="下一个设计方案">→</button></div><div class="switch-meta" id="state-label" aria-live="polite"></div></div>
<dialog id="month-dialog" aria-labelledby="month-dialog-title"><div class="dialog-head"><h2 id="month-dialog-title">跳转到月份</h2><button data-action="close-month" aria-label="关闭月份选择">×</button></div><div class="dialog-fields"><label>年份<select id="jump-year"></select></label><label>月份<select id="jump-month"></select></label></div><div class="dialog-actions"><button data-action="close-month">取消</button><button class="confirm" data-action="confirm-month">查看这个月</button></div></dialog>
<script>
// Throwaway UI exploration: A separate calendar, B date-first ticket, C history-integrated calendar.
// All records below are fictional fixtures and disappear on reload.
const today='2026-09-19', nowTime='14:32';
const labels=['颗粒偏硬','成块偏硬','成形有裂纹','光滑柔软','柔软小块','松散糊状','水样偏稀'];
const variants={A:'轻月历 · 推荐',B:'日期票据',C:'历史双视图'};
const records=[{id:1,date:'2026-09-18',time:'08:30',type:4},{id:2,date:'2026-09-18',time:'19:10',type:3},{id:3,date:'2026-09-17',time:'12:05',type:6},{id:4,date:'2026-09-15',time:'09:10',type:4},{id:5,date:'2026-09-12',time:'08:45',type:2},{id:6,date:'2026-08-29',time:'10:20',type:4}];
const params=new URLSearchParams(location.search);
const state={variant:variants[params.get('variant')]?params.get('variant'):'A',page:params.get('screen')==='home'?'home':params.get('screen')==='history'?'history':'calendar',origin:'home',selected:'2026-09-18',month:'2026-09',formOrigin:'calendar',formDate:'2026-09-18',formTime:'08:30',formType:0,editId:null,nowMode:false,feedback:''};
const app=document.getElementById('app');
const pad=n=>String(n).padStart(2,'0');
const key=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse=s=>new Date(Number(s.slice(0,4)),Number(s.slice(5,7))-1,Number(s.slice(8,10)||1),12);
const dateLabel=s=>{const d=parse(s);return `${d.getMonth()+1}月${d.getDate()}日 周${'日一二三四五六'[d.getDay()]}`};
const dayRecords=d=>records.filter(r=>r.date===d).sort((a,b)=>a.time.localeCompare(b.time));
const icon=t=>`../../assets/icons/ic_bristol_${pad(t)}.svg`;
function roll(active=false){return `<svg viewBox="0 0 36 44" aria-hidden="true" style="color:var(${active?'--color-moss':'--color-rule'})"><g fill="var(--color-raised)" stroke="currentColor" stroke-width="2" shape-rendering="crispEdges">${active?'<path d="M24 17H30V19H32V21H34V40H30V41H26V39H22V28Z"/>':''}<path d="M4 15V31H6V33H10V35H24V33H28V31H30V15Z"/><path d="M10 9H24V11H28V13H30V17H28V19H24V21H10V19H6V17H4V13H6V11H10Z"/><path d="M14 13H20V14H22V16H20V17H14V16H12V14H14Z" stroke-width="1"/></g><g fill="currentColor"><path d="M11 25H13V28H11ZM21 25H23V28H21ZM15 30H19V31H15Z"/></g></svg>`}
function toolbar(title,right='',back=true){return `<header class="toolbar">${back?'<button class="icon-btn back" data-action="back" aria-label="返回">‹</button>':''}<h1>${title}</h1>${right}</header>`}
function nav(active){return `<nav class="nav" aria-label="底部导航"><button data-action="home" class="${active==='home'?'active':''}"><img src="../../assets/icons/ic_ticket_calendar.svg" alt="">今天</button><button data-action="record-now" class="record-action">记录</button><button data-action="history" class="${active==='history'?'active':''}"><img src="../../assets/icons/ic_ticket_history.svg" alt="">历史</button></nav>`}
function recordRows(rs){return rs.map(r=>`<div class="row"><time>${r.time}</time><img src="${icon(r.type)}" alt=""><div class="record-copy"><b>${pad(r.type)}</b><span>${labels[r.type-1]}</span></div><button data-edit="${r.id}" aria-label="修改${r.time}的记录">修改</button></div>`).join('')}
function details(){const rs=dayRecords(state.selected);return `<section class="details"><div class="detail-head"><h2>${dateLabel(state.selected)}</h2><button class="text-btn" data-action="add-selected">＋补记</button></div>${state.feedback?`<p class="success" role="status">${state.feedback}</p>`:''}${rs.length?recordRows(rs):`<div class="empty">${roll()}<p>这一天还没有记录</p><small>忘记记下？可以在这里补一笔。</small><br><button class="outline-btn" data-action="add-selected">补记这一天</button></div>`}</section>`}
function monthBar(){const [year,month]=state.month.split('-').map(Number);return `<div class="month-bar"><button class="icon-btn" data-action="prev-month" aria-label="上个月" ${year===1900&&month===1?'disabled':''}>‹</button><button class="month-name" data-action="open-month" aria-label="选择年份和月份">${year}年${month}月 <span class="tiny">⌄</span></button><button class="icon-btn" data-action="next-month" aria-label="下个月" ${state.month>=today.slice(0,7)?'disabled':''}>›</button></div>`}
function calendarGrid(){const first=parse(state.month+'-01'),offset=(first.getDay()+6)%7,last=new Date(first.getFullYear(),first.getMonth()+1,0).getDate();let cells='';for(let i=0;i<42;i++){const n=i-offset+1;if(n<1||n>last){cells+='<span aria-hidden="true"></span>';continue}const d=`${state.month}-${pad(n)}`,rs=dayRecords(d),future=d>today;cells+=`<button class="day ${d===state.selected?'selected':''} ${d===today?'today':''}" data-day="${d}" ${future?'disabled':''} aria-pressed="${d===state.selected}" aria-label="${dateLabel(d)}${d===today?'，今天':''}，${rs.length?rs.length+'次记录':'未记录'}"><span class="daybox"><b>${n}</b><span class="marker">${rs.length>1?rs.length+'次':rs.length?'<i class="dot"></i>':''}</span></span></button>`}return `<div class="calendar"><div class="weekdays">${[...'一二三四五六日'].map(s=>`<span>${s}</span>`).join('')}</div><div class="days">${cells}</div></div><div class="legend"><span><i class="dot"></i> 有记录</span><span><i class="today-line"></i>今天</span><span>空白表示未记录</span></div>`}
function VariantA(){return toolbar('排便日历','<button class="text-btn" data-action="today">回今天</button>')+monthBar()+calendarGrid()+details()}
function VariantB(){const d=parse(state.selected),rs=dayRecords(state.selected);return toolbar('排便日历','<button class="text-btn" data-action="today">回今天</button>')+`<section class="ticket-hero"><span class="ticket-number">${pad(d.getDate())}</span><div class="ticket-copy">${d.getFullYear()}年${d.getMonth()+1}月 · 周${'日一二三四五六'[d.getDay()]}<br><span class="muted">${rs.length?rs.length+' 次记录':'尚未记录'}</span></div><button data-action="add-selected">＋补记</button></section>`+monthBar()+calendarGrid()+details()}
function VariantC(){return toolbar('历史','<button class="text-btn" data-action="add-default">＋补记</button>',false)+`<div class="view-tabs"><button data-action="history">列表</button><button class="current" data-action="calendar-demo">月历</button><button class="text-btn" data-action="today" style="margin-left:auto">回今天</button></div>`+monthBar()+calendarGrid()+details()+nav('history')}
function home(){const count=dayRecords(today).length;return `<h1 class="home-title">拉了么<span style="color:var(--color-moss)">？</span></h1><section class="home-status"><h2>今天</h2><div class="home-count"><strong>${count}</strong><span>次</span><img src="../../assets/images/toilet_paper_spirit_normal.png" alt="厕纸小精灵"></div></section><p class="latest">最近一次　${count?dayRecords(today).at(-1).time:'—'}</p><div class="week-heading"><h2>近 7 天</h2><div class="tools"><span>共 ${records.filter(r=>r.date>='2026-09-13'&&r.date<=today).length} 次</span><button data-action="calendar-today" aria-label="打开月历"><img class="calendar-icon" src="../../assets/icons/ic_ticket_calendar.svg" alt=""></button></div></div><div class="mini-week">${Array.from({length:7},(_,i)=>{const d=new Date(2026,8,13+i,12),k=key(d),count=dayRecords(k).length;return `<button data-home-day="${k}" aria-label="查看${dateLabel(k)}"><span>${k===today?'今':'日一二三四五六'[d.getDay()]}</span>${roll(count>0)}<small>${count?count+'次':'—'}</small></button>`}).join('')}</div><p class="home-hint">点一下，记一笔</p>${nav('home')}`}
function historyPage(){const dates=[...new Set(records.map(r=>r.date))].sort().reverse();return toolbar('历史','<button class="icon-btn" data-action="calendar-from-history" aria-label="查看月历"><img class="calendar-icon" src="../../assets/icons/ic_ticket_calendar.svg" alt=""></button><button class="text-btn" data-action="add-default">＋补记</button>',false)+`<p class="summary">共 ${records.length} 笔记录</p>${state.variant==='C'?'<div class="view-tabs"><button class="current" data-action="history">列表</button><button data-action="calendar-from-history">月历</button></div>':''}${state.feedback?`<p class="success" role="status">${state.feedback}</p>`:''}${dates.map(d=>`<section class="history-group"><h2>${dateLabel(d)}</h2>${recordRows(dayRecords(d))}</section>`).join('')}${nav('history')}`}
function form(){return toolbar(state.nowMode?'记录':state.editId?'修改记录':'补记')+`${state.nowMode?'':`<div class="form-date"><div class="pills"><button data-form-day="${today}" class="${state.formDate===today?'chosen':''}">今天</button><button data-form-day="2026-09-18" class="${state.formDate==='2026-09-18'?'chosen':''}">昨天</button><button data-action="pick-date">其他日期</button></div><div class="fields"><label>记录日期<input id="record-date" type="date" value="${state.formDate}" max="${today}" min="1900-01-01" required></label><label>具体时间<input id="record-time" type="time" value="${state.formTime}" required></label></div></div>`}<h2>更接近哪一种？</h2><p class="summary">${state.nowMode?'点选后立即记下，可随时修改':'选好形态后，确认保存到这一天'}</p><div class="shape-list">${labels.map((s,i)=>`<button class="shape-choice" data-type="${i+1}" aria-pressed="${state.formType===i+1}"><img src="${icon(i+1)}" alt=""><span class="shape-copy"><span class="shape-code">${pad(i+1)}</span>${s}</span><span class="radio" aria-hidden="true"></span></button>`).join('')}</div>${state.nowMode?'':`<p class="error" id="form-error" role="alert"></p><button class="save" id="save-record" data-action="save" ${state.formType?'':'disabled'}>${state.editId?'保存修改':'补记到 '+dateLabel(state.formDate).split(' ')[0]}</button>`}`}
function render(){app.className='variant-'+state.variant;app.innerHTML=state.page==='home'?home():state.page==='history'?historyPage():state.page==='form'?form():({A:VariantA,B:VariantB,C:VariantC}[state.variant])();document.getElementById('variant-label').textContent=state.variant+' · '+variants[state.variant];document.getElementById('state-label').textContent=`${{home:'首页',history:'历史列表',calendar:'月历',form:'记录页'}[state.page]} · ${state.page==='form'?state.formDate:state.selected} · 演示记录 ${records.length} 条`;}
function route(page){state.page=page;state.feedback='';render();window.scrollTo(0,0)}
function openCalendar(d,origin){state.selected=d;state.month=d.slice(0,7);state.origin=origin;route('calendar')}
function openForm(d,id=null,nowMode=false){state.formOrigin=state.page;state.editId=id;state.nowMode=nowMode;const r=records.find(r=>r.id===id);state.formDate=r?r.date:d;state.formTime=r?r.time:nowTime;state.formType=r?r.type:0;route('form')}
function shiftMonth(delta){const d=parse(state.month+'-01');d.setMonth(d.getMonth()+delta);setMonth(`${d.getFullYear()}-${pad(d.getMonth()+1)}`)}
function setMonth(m){if(m<'1900-01'||m>today.slice(0,7))return;const d=parse(m+'-01'),last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();let n=Math.min(Number(state.selected.slice(8)),last);if(m===today.slice(0,7))n=Math.min(n,Number(today.slice(8)));state.month=m;state.selected=m+'-'+pad(n);state.feedback='';render()}
function cycle(delta){const keys=Object.keys(variants);state.variant=keys[(keys.indexOf(state.variant)+delta+3)%3];const url=new URL(location.href);url.searchParams.set('variant',state.variant);window.history.replaceState(null,'',url);if(state.page==='form')state.page='calendar';render();window.scrollTo(0,0)}
function save(){if(!state.formType)return;const dateEl=document.getElementById('record-date'),timeEl=document.getElementById('record-time');if(dateEl){state.formDate=dateEl.value;state.formTime=timeEl.value}const error=document.getElementById('form-error');if(!state.formDate||!state.formTime||state.formDate<'1900-01-01'||state.formDate>today||(state.formDate===today&&state.formTime>nowTime)){if(error)error.textContent='请选择已经发生的日期和时间。';return}const r={id:state.editId||Date.now(),date:state.formDate,time:state.formTime,type:state.formType};const idx=records.findIndex(x=>x.id===state.editId);if(idx>=0)records[idx]=r;else records.push(r);state.selected=r.date;state.month=r.date.slice(0,7);state.page=state.formOrigin;state.feedback=(state.editId?'已修改到 ':'已补记到 ')+dateLabel(r.date).split(' ')[0];render();window.scrollTo(0,0)}
function refreshMonths(){const year=Number(document.getElementById('jump-year').value),el=document.getElementById('jump-month'),old=Number(el.value)||Number(state.month.slice(5));el.innerHTML=Array.from({length:12},(_,i)=>`<option value="${pad(i+1)}" ${year===2026&&i>=9?'disabled':''}>${i+1}月</option>`).join('');el.value=pad(year===2026?Math.min(old,9):old)}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;if(b.dataset.day){state.selected=b.dataset.day;state.feedback='';render();return}if(b.dataset.homeDay){openCalendar(b.dataset.homeDay,'home');return}if(b.dataset.edit){openForm('',Number(b.dataset.edit));return}if(b.dataset.formDay){state.formDate=b.dataset.formDay;render();return}if(b.dataset.type){state.formType=Number(b.dataset.type);if(state.nowMode){save()}else{render();document.querySelector(`[data-type="${state.formType}"]`).focus({preventScroll:true})}return}switch(b.dataset.action){case'home':route('home');break;case'history':route('history');break;case'calendar-demo':openCalendar('2026-09-18','home');break;case'calendar-today':openCalendar(today,'home');break;case'calendar-from-history':openCalendar(today,'history');break;case'back':route(state.page==='form'?state.formOrigin:state.origin);break;case'today':state.selected=today;state.month=today.slice(0,7);state.feedback='';render();break;case'prev-month':shiftMonth(-1);break;case'next-month':shiftMonth(1);break;case'add-selected':openForm(state.selected);break;case'add-default':openForm('2026-09-18');break;case'record-now':openForm(today,null,true);break;case'pick-date':document.getElementById('record-date').showPicker?.();break;case'save':save();break;case'variant-prev':cycle(-1);break;case'variant-next':cycle(1);break;case'open-month':{const y=document.getElementById('jump-year');y.innerHTML=Array.from({length:127},(_,i)=>`<option value="${2026-i}">${2026-i}年</option>`).join('');y.value=state.month.slice(0,4);refreshMonths();document.getElementById('jump-month').value=state.month.slice(5);document.getElementById('month-dialog').showModal();break}case'close-month':document.getElementById('month-dialog').close();break;case'confirm-month':setMonth(document.getElementById('jump-year').value+'-'+document.getElementById('jump-month').value);document.getElementById('month-dialog').close();break}});
document.addEventListener('change',e=>{if(e.target.id==='jump-year')refreshMonths();if(e.target.id==='record-date'){state.formDate=e.target.value;const saveButton=document.getElementById('save-record');if(state.formDate&&saveButton)saveButton.textContent=state.editId?'保存修改':'补记到 '+dateLabel(state.formDate).split(' ')[0]}if(e.target.id==='record-time')state.formTime=e.target.value});
document.addEventListener('keydown',e=>{if(e.target.matches('input,select,textarea,[contenteditable]')||document.querySelector('dialog[open]'))return;if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();cycle(e.key==='ArrowLeft'?-1:1)}});
render();
</script>
</body>
</html>
