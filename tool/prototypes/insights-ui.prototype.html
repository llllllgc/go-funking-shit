<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>拉了么 · 记录回顾呈现草图</title>
<link rel="stylesheet" href="tokens.css">
<style>
/* Three history-page variants selected by ?variant=A/B/C. Fictional, read-only data. */
@font-face{font-family:Zpix;src:url('../../assets/fonts/zpix.ttf') format('truetype');font-display:swap}
*{box-sizing:border-box}html,body{margin:0;background:var(--color-paper);color:var(--color-ink);font-family:var(--font-body)}
body{padding-bottom:112px}button{font:inherit;color:inherit;cursor:pointer;border:0;background:transparent;min-height:44px}button:focus-visible{outline:2px solid var(--color-moss);outline-offset:2px}button:active{transform:translateY(1px)}
h1,h2,h3,p{margin:0}h1,h2,h3,.pixel{font-family:var(--font-display);font-weight:400}h1{font-size:30px;line-height:1.3}h2{font-size:20px;line-height:1.35}h3{font-size:17px;line-height:1.4}
.demo{max-width:420px;margin:auto;padding:13px 24px;border-bottom:1px dashed var(--color-rule);font-size:11px;color:var(--color-muted)}.scenarios{display:flex;gap:4px;flex-wrap:wrap;margin-top:8px}.scenarios button{min-height:34px;padding:5px 10px;border:1px solid var(--color-rule);font-size:11px}.scenarios button[aria-pressed=true]{border-color:var(--color-moss);background:var(--color-pale);color:var(--color-moss-ink)}
#app{max-width:420px;margin:auto;min-height:650px;padding:22px 24px 12px}.top{display:flex;align-items:center;gap:8px}.top h1{flex:1}.top button{padding:8px 2px;color:var(--color-moss-ink);font-size:14px}.top .calendar{width:30px;margin-right:8px}.top img{width:22px;height:22px}.count{color:var(--color-muted);font-size:16px;margin:7px 0 24px}.group{margin:0 0 26px}.group-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.group-head h2{font-size:18px}.group-head span{color:var(--color-muted);font-size:12px}.record{display:flex;align-items:center;gap:10px;min-height:78px;border-bottom:1px solid var(--color-rule)}.record time{font-size:15px;min-width:62px}.record img{width:38px;height:38px}.record-copy{flex:1;display:grid;gap:2px}.record-copy strong{font-family:var(--font-display);color:var(--color-moss-ink);font-size:16px;font-weight:400}.record-copy span{font-size:13px}.row-icons{color:var(--color-muted);font-size:14px;letter-spacing:4px}.bottom-nav{display:flex;align-items:end;justify-content:space-around;border-top:1px solid var(--color-rule);margin:70px -24px 0;padding:0 0 12px}.bottom-nav button{width:70px;min-height:62px;font-size:12px;color:var(--color-muted);line-height:1.35}.bottom-nav img{width:23px;height:23px;display:block;margin:0 auto 3px}.bottom-nav .current{color:var(--color-moss-ink)}.bottom-nav .record-now{font-family:var(--font-display);font-size:16px;border:2px solid var(--color-ink);border-radius:50%;background:var(--color-mustard);width:65px;height:65px;min-height:65px;margin-top:-30px;color:var(--color-ink)}
.entry{display:flex;align-items:center;width:100%;text-align:left;border-top:1px solid var(--color-rule);border-bottom:1px solid var(--color-rule);padding:12px 2px;margin:-4px 0 28px}.entry-icon{font-family:var(--font-display);font-size:24px;color:var(--color-moss-ink);margin-right:14px}.entry-copy{flex:1;display:grid;gap:3px;min-width:0}.entry-copy strong{font-family:var(--font-display);font-size:16px;font-weight:400}.entry-copy small{color:var(--color-muted);font-size:11px;white-space:normal}.chevron{font-size:22px;color:var(--color-moss-ink)}
.back-head{display:flex;align-items:center;gap:8px;margin-bottom:6px}.back-head button{min-width:34px;padding:0;font-size:26px}.back-head h1{flex:1}.period{color:var(--color-muted);font-size:13px;margin:0 0 28px 42px}.review-lead{border-top:1px solid var(--color-ink);padding-top:18px}.review-lead .eyebrow{font-size:11px;color:var(--color-moss-ink);margin-bottom:8px}.review-lead h2{font-size:24px;line-height:1.5;margin-bottom:8px}.review-lead p{font-size:13px;line-height:1.7;color:var(--color-muted)}.stats{display:flex;gap:16px;padding:22px 0;border-bottom:1px solid var(--color-rule)}.stat{flex:1;display:grid;gap:5px}.stat b{font:normal 30px/1 'Zpix',sans-serif;color:var(--color-moss-ink)}.stat small{font-size:11px;color:var(--color-muted)}.section{padding:24px 0;border-bottom:1px solid var(--color-rule)}.section h3{margin-bottom:14px}.dist{display:grid;gap:12px}.dist-row{display:grid;grid-template-columns:70px minmax(0,1fr) 25px;gap:10px;align-items:center;font-size:12px}.bar{height:9px;background:var(--color-pale)}.fill{height:100%;background:var(--color-moss)}.dist-row:last-child .fill{background:var(--color-mustard)}.section-note{font-size:11px;line-height:1.6;color:var(--color-muted);margin-top:12px}.advice{background:var(--color-pale);padding:16px;margin:26px 0 0}.advice .tag{font-size:11px;color:var(--color-moss-ink);margin-bottom:8px}.advice p{font-size:14px;line-height:1.7}.source{font-size:12px;color:var(--color-muted);line-height:1.7;margin-top:18px}.source button{text-decoration:underline;text-underline-offset:3px;color:var(--color-moss-ink);padding:0;min-height:36px}.source-detail{border-left:2px solid var(--color-rule);padding-left:10px;margin-top:4px}
.inline{border-top:1px solid var(--color-rule);border-bottom:1px solid var(--color-rule);margin:-4px 0 28px}.inline-toggle{width:100%;display:flex;align-items:center;text-align:left;padding:12px 0}.inline-toggle h2{flex:1;font-size:17px}.inline-toggle span{color:var(--color-moss-ink);font-size:12px}.inline-body{padding:2px 0 18px}.inline-summary{font-size:13px;line-height:1.65;margin-bottom:12px}.inline-mini{display:flex;height:10px;gap:3px;margin:8px 0 12px}.inline-mini span{min-width:3px}.inline-body .advice{margin-top:12px}.inline-body .advice p{font-size:12px}.inline-body .more{color:var(--color-moss-ink);font-size:12px;border-bottom:1px solid var(--color-moss);padding:2px 0;min-height:36px}
.tabs{display:flex;gap:28px;border-bottom:1px solid var(--color-rule);margin:-6px 0 22px}.tabs button{padding:8px 0;min-height:42px;font-size:15px}.tabs button[aria-selected=true]{border-bottom:2px solid var(--color-moss);color:var(--color-moss-ink)}.tab-review .review-lead h2{font-size:22px}.tab-review .section{padding:20px 0}.tab-review .period{margin:0 0 20px}.empty-review{padding:20px 0;border-top:1px solid var(--color-ink)}.empty-review h2{font-size:21px;margin-bottom:10px}.empty-review p{font-size:13px;line-height:1.7;color:var(--color-muted)}
.switcher{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);max-width:calc(100% - 16px);width:380px;background:var(--color-ink);color:var(--color-raised);z-index:5;display:flex;align-items:center;gap:8px;padding:3px 7px;box-shadow:0 4px 15px #1f292b33}.switcher button{color:var(--color-raised);min-width:44px}.switcher span{flex:1;text-align:center;font-size:12px}.capture .demo,.capture .switcher{display:none}.capture{padding-bottom:0}.capture #app{min-height:812px}@media(max-width:350px){#app,.demo{padding-left:16px;padding-right:16px}.bottom-nav{margin-left:-16px;margin-right:-16px}.top h1{font-size:27px}.dist-row{grid-template-columns:65px minmax(0,1fr) 20px;gap:7px}}@media(prefers-reduced-motion:reduce){button:active{transform:none}}
.bottom-nav{position:fixed;bottom:70px;left:50%;transform:translateX(-50%);width:min(420px,100%);z-index:2;margin:0;background:var(--color-paper)}
</style>
</head>
<body>
<div class="demo">记录回顾呈现草图 · 全部为虚构演示数据，不会写入 App<div class="scenarios" aria-label="示例数据"><button data-scenario="mixed">常见记录</button><button data-scenario="hard">偏硬较多</button><button data-scenario="sparse">记录较少</button></div></div>
<main id="app"></main>
<div class="switcher" aria-label="设计方案切换"><button data-action="prev" aria-label="上一个方案">←</button><span id="variant-label"></span><button data-action="next" aria-label="下一个方案">→</button></div>
<script>
// Read-only design exploration. Dates, records and copy are fictional fixtures.
const variants={A:'轻入口 · 独立回顾',B:'历史内折叠',C:'历史双标签'};
const names={1:['04','颗粒偏硬'],2:['02','成块偏硬'],3:['03','成形有裂纹'],4:['01','光滑柔软'],5:['05','柔软小块'],6:['06','松散糊状'],7:['07','水样偏稀']};
const scenarios={
  mixed:[['10月5日 周一','14:32',4],['10月4日 周日','09:14',3],['10月2日 周五','08:50',5],['10月2日 周五','18:12',4],['9月30日 周三','07:42',6]],
  hard:[['10月5日 周一','08:32',1],['10月4日 周日','09:14',2],['10月3日 周六','08:50',2],['10月2日 周五','18:12',4],['10月1日 周四','07:42',1],['9月30日 周三','09:18',3]],
  sparse:[['10月4日 周日','09:14',4]]
};
const params=new URLSearchParams(location.search);
const state={variant:variants[params.get('variant')]?params.get('variant'):'A',scenario:scenarios[params.get('scenario')]?params.get('scenario'):'mixed',page:params.get('view')==='review'?'review':'history',expanded:params.get('expanded')==='1',tab:params.get('tab')==='review'?'review':'list',source:false};
const app=document.getElementById('app');
function data(){const rows=scenarios[state.scenario];return {rows,days:new Set(rows.map(r=>r[0])).size,hard:rows.filter(r=>r[2]<=2).length,formed:rows.filter(r=>r[2]===3||r[2]===4).length,soft:rows.filter(r=>r[2]===5).length,loose:rows.filter(r=>r[2]>=6).length}}
function nav(){return '<nav class="bottom-nav" aria-label="主导航"><button><img src="../../assets/icons/ic_ticket_today.svg" alt="">今天</button><button class="record-now">记录</button><button class="current"><img src="../../assets/icons/ic_ticket_history.svg" alt="">历史</button></nav>'}
function head(){return '<header class="top"><h1>历史</h1><button class="calendar" aria-label="月历"><img src="../../assets/icons/ic_ticket_calendar.svg" alt=""></button><button>＋补记</button></header>'}
function list(){const groups=new Map();for(const row of data().rows){if(!groups.has(row[0]))groups.set(row[0],[]);groups.get(row[0]).push(row)}return [...groups].map(([date,rows])=>`<section class="group"><div class="group-head"><h2>${date}</h2><span>${rows.length} 次</span></div>${rows.map(r=>`<div class="record"><time>${r[1]}</time><img src="../../assets/icons/ic_bristol_${String(r[2]).padStart(2,'0')}.svg" alt=""><span class="record-copy"><strong>${names[r[2]][0]}</strong><span>${names[r[2]][1]}</span></span><span class="row-icons" aria-hidden="true">✎ ▣</span></div>`).join('')}</section>`).join('')}
function insight(d){if(d.rows.length<3||d.days<2)return '先记下几次，再一起回看。';if(d.hard>=Math.ceil(d.rows.length/2))return '偏硬的形态，在已记录内容里出现较多。';return '这几天记录了几种不同形态。'}
function advice(d){if(d.rows.length<3||d.days<2)return '';if(d.hard>=Math.ceil(d.rows.length/2))return '可以留意饮水、膳食纤维和日常活动，先从一件容易做到的小事开始。';return '如果想观察变化，可以继续记录，过段时间再回看。'}
function dist(d){const bars=[['偏硬',d.hard],['成形',d.formed],['柔软小块',d.soft],['偏稀',d.loose]];return `<div class="dist">${bars.map(([name,count])=>`<div class="dist-row"><span>${name}</span><span class="bar"><span class="fill" style="display:block;width:${100*count/d.rows.length}%"></span></span><span>${count}</span></div>`).join('')}</div>`}
function reviewBody(compact=false){const d=data(),small=d.rows.length<3||d.days<2;if(small)return `<section class="empty-review"><h2>先积累几笔记录</h2><p>近 7 天记了 ${d.rows.length} 次，分布在 ${d.days} 天。现在不判断趋势；有记录后，这里会回看形态分布。</p><p class="section-note">空白日期只表示未记录，不代表没有排便。</p></section>`;return `<section class="review-lead"><div class="eyebrow">基于你已记录的内容</div><h2>${insight(d)}</h2><p>近 7 天共 ${d.rows.length} 笔，分布在 ${d.days} 天。</p></section><div class="stats"><div class="stat"><b>${d.rows.length}</b><small>笔记录</small></div><div class="stat"><b>${d.days}</b><small>天有记录</small></div></div><section class="section"><h3>形态分布</h3>${dist(d)}<p class="section-note">按实际形态归类；空白日期只表示未记录。</p></section><aside class="advice"><div class="tag">给自己的一张小纸条</div><p>${advice(d)}</p></aside>${compact?'':`<div class="source"><button data-action="source" aria-expanded="${state.source}">这些内容怎么算的？ ${state.source?'⌃':'⌄'}</button>${state.source?'<p class="source-detail">只统计 9月29日—10月5日保存的形态和时间。记录不能反映未记录的日子，也不能单靠形态判断健康状况或原因。建议仅作一般生活参考。</p>':''}</div>`}`}
function VariantA(){if(state.page==='review')return `<header class="back-head"><button data-action="back" aria-label="返回历史">‹</button><h1>记录回顾</h1></header><p class="period">近 7 天 · 9月29日—10月5日</p>${reviewBody()}`;const d=data();return `${head()}<p class="count">共 ${d.rows.length} 笔记录</p><button class="entry" data-action="open"><span class="entry-icon">▤</span><span class="entry-copy"><strong>记录回顾</strong><small>近 7 天 · ${d.rows.length} 笔记录，点开看看</small></span><span class="chevron">›</span></button>${list()}${nav()}`}
function VariantB(){if(state.page==='review')return `<header class="back-head"><button data-action="back" aria-label="返回历史">‹</button><h1>记录回顾</h1></header><p class="period">近 7 天 · 9月29日—10月5日</p>${reviewBody()}`;const d=data(),small=d.rows.length<3||d.days<2;return `${head()}<p class="count">共 ${d.rows.length} 笔记录</p><section class="inline"><button class="inline-toggle" data-action="expand" aria-expanded="${state.expanded}"><h2>近 7 天回顾</h2><span>${state.expanded?'收起 ↑':'展开 ↓'}</span></button>${state.expanded?`<div class="inline-body"><p class="inline-summary">${insight(d)}</p>${small?'<p class="section-note">记录较少，暂不比较趋势。</p>':`<div class="inline-mini" aria-label="偏硬、成形、柔软小块、偏稀的形态分布"><span style="flex:${d.hard};background:var(--color-moss)"></span><span style="flex:${d.formed};background:var(--color-moss-ink)"></span><span style="flex:${d.soft};background:var(--color-mustard)"></span><span style="flex:${d.loose};background:var(--color-rule)"></span></div><p class="section-note">${d.rows.length} 笔记录 · ${d.days} 天有记录</p><aside class="advice"><div class="tag">小纸条</div><p>${advice(d)}</p></aside>`}<button class="more" data-action="open">看完整回顾 →</button></div>`:''}</section>${list()}${nav()}`}
function VariantC(){const d=data();return `${head()}<p class="count">共 ${d.rows.length} 笔记录</p><div class="tabs" role="tablist" aria-label="历史内容"><button role="tab" aria-selected="${state.tab==='list'}" data-action="list-tab">记录</button><button role="tab" aria-selected="${state.tab==='review'}" data-action="review-tab">回顾</button></div>${state.tab==='list'?list():`<div class="tab-review"><p class="period">近 7 天 · 9月29日—10月5日</p>${reviewBody()}</div>`}${nav()}`}
function render(){app.innerHTML={A:VariantA,B:VariantB,C:VariantC}[state.variant]();document.getElementById('variant-label').textContent=`${state.variant} · ${variants[state.variant]}`;document.querySelectorAll('[data-scenario]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.scenario===state.scenario))}
function cycle(delta){const keys=Object.keys(variants),index=keys.indexOf(state.variant);state.variant=keys[(index+delta+keys.length)%keys.length];state.page='history';state.expanded=false;state.tab='list';state.source=false;const url=new URL(location.href);url.searchParams.set('variant',state.variant);history.replaceState(null,'',url);render();scrollTo(0,0)}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.scenario){state.scenario=b.dataset.scenario;state.page='history';state.tab='list';state.expanded=false;state.source=false;const url=new URL(location.href);url.searchParams.set('scenario',state.scenario);history.replaceState(null,'',url);render();return}switch(b.dataset.action){case'prev':cycle(-1);return;case'next':cycle(1);return;case'open':state.page='review';state.expanded=false;break;case'back':state.page='history';break;case'expand':state.expanded=!state.expanded;break;case'list-tab':state.tab='list';break;case'review-tab':state.tab='review';break;case'source':state.source=!state.source;break;default:return}render();if(['open','back','list-tab','review-tab'].includes(b.dataset.action))scrollTo(0,0)});
document.addEventListener('keydown',e=>{if(e.target.matches('input,textarea,select,[contenteditable]'))return;if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();cycle(e.key==='ArrowLeft'?-1:1)}});
render();
</script>
</body>
</html>
